services:
  telepass:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: '2'
